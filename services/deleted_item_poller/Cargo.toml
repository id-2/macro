[package]
edition = "2024"
name = "deleted_item_poller"
publish = false
version = "0.1.0"

[dependencies]
anyhow = { workspace = true }
aws-sdk-sqs = { workspace = true }
rox_aws_config = { path = "../../crates/rox_aws_config" }
aws_lambda_events = { workspace = true, features = ["eventbridge"] }
chat = { path = "../../crates/chat", default-features = false }
chrono = { workspace = true }
documents = { path = "../../crates/documents", default-features = false }
futures = { workspace = true }
lambda_runtime = { workspace = true }
rox_db_client = { path = "../../crates/rox_db_client" }
rox_entrypoint = { path = "../../crates/rox_entrypoint" }
rox_env = { path = "../../crates/rox_env" }
rox_env_var = { path = "../../crates/rox_env_var" }
rox_event_broker = { path = "../../crates/rox_event_broker" }
rox_queues = { path = "../../crates/rox_queues" }
model_owner = { path = "../../crates/model_owner" }
projects = { path = "../../crates/projects", default-features = false }
serde_json = { workspace = true }
sqlx = { workspace = true }
sqs_client = { path = "../../crates/sqs_client", default-features = false, features = [
  "chat",
  "document",
] }
tokio = { workspace = true }
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
rox_db_migrator = { path = "../../crates/rox_db_migrator" }
