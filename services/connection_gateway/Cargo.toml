[package]
edition = "2024"
name = "connection_gateway"
publish = false
version = "0.1.0"

[lib]
name = "connection_gateway"
path = "src/lib.rs"

[[bin]]
name = "connection_gateway_service"
path = "src/main.rs"

[[bin]]
name = "connection_gateway_doppler_config"
path = "src/doppler_config.rs"


[[bin]]
name = "stale_connections"
path = "scripts/stale_connections.rs"

[[bin]]
name = "connection_gateway_openapi"
path = "src/openapi.rs"

[features]
local_auth = ["rox_authorization/local_auth"]

[dependencies]
agent_correlation = { path = "../../crates/agent_correlation", features = ["http", "postgres"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws-sdk-secretsmanager = { workspace = true }
axum = { workspace = true, features = ["macros", "tower-log", "ws"] }
chrono = { workspace = true }
connection_gateway_client = { path = "../../crates/connection_gateway_client" }
connection_gateway_models = { path = "../../crates/connection_gateway_models" }
cowlike = { path = "../../crates/cowlike" }
dashmap = { workspace = true }
ensure_exists = { path = "../../crates/ensure_exists", features = ["dynamodb"] }
entity_access = { path = "../../crates/entity_access", default-features = false, features = ["outbound"] }
frecency = { path = "../../crates/frecency", features = [
  "inbound",
  "outbound",
  "postgres",
] }
futures = { workspace = true }
http-body-util = { workspace = true }
itertools = { workspace = true }
last_online_tracker = { path = "../../crates/last_online_tracker" }
rox_auth = { path = "../../crates/rox_auth" }
rox_authorization = { path = "../../crates/rox_authorization", features = [
  "postgres",
] }
rox_user_id = { path = "../../crates/rox_user_id" }
rox_aws_config = { path = "../../crates/rox_aws_config" }
rox_config = { path = "../../crates/rox_config" }
rox_entrypoint = { path = "../../crates/rox_entrypoint" }
rox_env = { path = "../../crates/rox_env" }
rox_env_var = { path = "../../crates/rox_env_var" }
rox_tower_layers = { path = "../../crates/rox_tower_layers" }
postcard = { workspace = true }
model = { path = "../../crates/model" }
model-entity = { path = "../../crates/model-entity" }
models_bulk_upload = { path = "../../crates/models_bulk_upload" }
opentelemetry = { workspace = true, features = ["trace"] }
redis = { workspace = true, features = [
  "aio",
  "tokio-comp",
  "tokio-rustls-comp",
] }
secretsmanager_client = { path = "../../crates/secretsmanager_client" }
serde = { workspace = true }
serde_dynamo = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
strum = { workspace = true, features = ["derive"] }
stream = { path = "../../crates/stream" }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true, features = ["attributes"] }
tracing-opentelemetry = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-swagger-ui = { workspace = true, features = ["axum"] }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
doppler-config = { workspace = true }

[dev-dependencies]
cool_asserts = "2"
rox_auth = { path = "../../crates/rox_auth", features = ["testing"] }
