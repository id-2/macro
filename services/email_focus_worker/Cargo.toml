[package]
edition = "2024"
name = "email_focus_worker"
publish = false
version = "0.1.0"

[[bin]]
name = "email_focus_worker"
path = "src/main.rs"

[[bin]]
name = "email_focus_worker_doppler_config"
path = "src/doppler_config.rs"

[dependencies]
ai_usage = { path = "../../crates/ai_usage" }
calendar_events = { path = "../../crates/calendar_events", features = ["postgres"] }
chrono = { workspace = true }
connection_gateway_client = { path = "../../crates/connection_gateway_client" }
doppler-config = { workspace = true }
email = { path = "../../crates/email", default-features = false, features = ["outbound", "ports"] }
feature_flags = { path = "../../crates/feature_flags" }
futures = { workspace = true }
jev = { path = "../../crates/jev", features = ["outbound"] }
kafka_util = { path = "../../crates/kafka_util" }
rox_auth = { path = "../../crates/rox_auth" }
rox_authorization = { path = "../../crates/rox_authorization", default-features = false, features = ["axum"] }
rox_config = { path = "../../crates/rox_config" }
rox_entrypoint = { path = "../../crates/rox_entrypoint" }
rox_env = { path = "../../crates/rox_env" }
rox_env_var = { path = "../../crates/rox_env_var" }
rox_event_broker = { path = "../../crates/rox_event_broker", features = ["outbound"] }
rox_service_urls = { path = "../../crates/rox_service_urls" }
rox_tower_layers = { path = "../../crates/rox_tower_layers" }
rox_user_id = { path = "../../crates/rox_user_id" }
memory = { path = "../../crates/memory" }
models_email = { path = "../../crates/models_email" }
opentelemetry = { workspace = true, features = ["trace"] }
rdkafka = { workspace = true }
reqwest = { workspace = true }
rootcause = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["signal", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
universal_input = { path = "../../crates/universal_input" }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
rox_db_migrator = { path = "../../crates/rox_db_migrator" }
wiremock = { workspace = true }
