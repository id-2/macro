[package]
default-run = "convert_service"
edition = "2024"
name = "convert_service"
publish = false
version = "0.1.0"

[[bin]]
name = "convert_service_doppler_config"
path = "src/doppler_config.rs"

[features]
disable_cleanup = []
disable_worker = []
local_queue = []

[dependencies]
anyhow = { workspace = true }
aws-sdk-lambda = { workspace = true }
aws-sdk-sqs = { workspace = true }
axum = { workspace = true }
database_env_vars = { path = "../../crates/database_env_vars" }
doppler-config = { workspace = true }
futures = { workspace = true }
http-body-util = { workspace = true }
lambda_client = { path = "../../crates/lambda_client" }
rox_auth = { path = "../../crates/rox_auth" }
rox_authorization = { path = "../../crates/rox_authorization", features = [
  "postgres",
] }
rox_aws_config = { path = "../../crates/rox_aws_config", features = ["s3"] }
rox_cors = { path = "../../crates/rox_cors" }
rox_config = { path = "../../crates/rox_config" }
rox_db_client = { path = "../../crates/rox_db_client" }
rox_entrypoint = { path = "../../crates/rox_entrypoint" }
rox_env = { path = "../../crates/rox_env" }
rox_env_var = { path = "../../crates/rox_env_var" }
rox_middleware = { path = "../../crates/rox_middleware", default-features = false }
rox_queues = { path = "../../crates/rox_queues" }
rox_uuid = { path = "../../crates/rox_uuid" }
model = { path = "../../crates/model" }
s3_key = { path = "../../crates/s3_key" }
nix = { version = "0.29.0", features = ["process", "signal"] }
rs-libreoffice-bindings = { git = "https://github.com/macro-inc/rs-libreoffice-bindings", rev = "056a40ddfac1d9650be30b9f0b4b934e9266c7dc" }
s3_client = { path = "../../crates/s3_client" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
sqs_client = { path = "../../crates/sqs_client" }
sqs_worker = { path = "../../crates/sqs_worker" }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
zip = { workspace = true, features = ["bzip2"] }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
aws-sdk-s3 = { workspace = true }
docx_engine = { path = "../../crates/docx_engine" }
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["testing", "trace"] }
pptx_engine = { path = "../../crates/pptx_engine" }
tempfile = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
