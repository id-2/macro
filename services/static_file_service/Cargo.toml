[package]
edition = "2024"
name = "static_file_service"
publish = false
version = "0.1.0"

[[bin]]
name = "static_file_service"
path = "src/main.rs"

[[bin]]
name = "static_file_service_openapi"
path = "src/openapi.rs"

[[bin]]
name = "static_file_service_doppler_config"
path = "src/doppler_config.rs"

[features]
dynamodb_client_test = []
local_auth = ["rox_authorization/local_auth"]
tree_trace = []

[dependencies]
# The session scope a code-mode credential signs, checked before handlers.
agent_correlation = { path = "../../crates/agent_correlation", features = ["http"] }
anyhow = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-sdk-secretsmanager = { workspace = true }
aws-sdk-sqs.workspace = true
axum = { workspace = true, features = ["tower-log", "ws"] }
chrono = { workspace = true }
doppler-config = { workspace = true }
rox_auth = { path = "../../crates/rox_auth" }
rox_authorization = { path = "../../crates/rox_authorization" }
rox_aws_config = { path = "../../crates/rox_aws_config", features = ["s3"] }
rox_config = { path = "../../crates/rox_config" }
rox_cors = { path = "../../crates/rox_cors" }
rox_entrypoint = { path = "../../crates/rox_entrypoint" }
rox_env = { path = "../../crates/rox_env" }
rox_env_var = { path = "../../crates/rox_env_var" }
rox_queues = { path = "../../crates/rox_queues" }
model = { path = "../../crates/model" }
models_sfs = { path = "../../crates/models_sfs" }
s3_key = { path = "../../crates/s3_key" }
secretsmanager_client = { path = "../../crates/secretsmanager_client" }
serde = { workspace = true }
serde_dynamo = { workspace = true }
serde_json = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true, features = ["limit", "timeout"] }
tracing.workspace = true
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true, features = ["axum"] }
uuid.workspace = true

rox_service_urls = { path = "../../crates/rox_service_urls" }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
rox_auth = { path = "../../crates/rox_auth", features = ["testing"] }
tower = { workspace = true, features = ["util"] }
