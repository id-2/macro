[package]
edition = "2024"
name = "sha_cleanup_worker"
publish = false
version = "0.1.0"

[features]
local = []
redis_client_test = []

[dependencies]
anyhow = { workspace = true }
aws-sdk-s3 = { workspace = true }
rox_aws_config = { path = "../../crates/rox_aws_config", features = ["s3"] }
futures = { workspace = true }
rox_entrypoint = { path = "../../crates/rox_entrypoint" }
rox_env = { path = "../../crates/rox_env" }
rox_env_var = { path = "../../crates/rox_env_var" }
rox_sha_count_client = { path = "../../crates/rox_sha_count_client" }
mockall = { workspace = true }
redis = { workspace = true, features = [
  "aio",
  "tokio-rustls-comp",
] }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
