[package]
edition = "2024"
name = "image_proxy_service"
publish = false
version = "0.1.0"
default-run = "image_proxy_service"

[[bin]]
name = "image_proxy_service"
path = "src/main.rs"

[[bin]]
name = "image_proxy_service_openapi"
path = "src/openapi.rs"

[[bin]]
name = "image_proxy_service_doppler_config"
path = "src/doppler_config.rs"

[dependencies]
agent_correlation = { path = "../../crates/agent_correlation", features = ["http"] }
anyhow = { workspace = true }
aws-sdk-secretsmanager = { workspace = true }
axum = { workspace = true, features = ["macros"] }
doppler-config = { workspace = true }
rox_auth = { path = "../../crates/rox_auth" }
rox_authorization = { path = "../../crates/rox_authorization" }
rox_aws_config = { path = "../../crates/rox_aws_config" }
rox_config = { path = "../../crates/rox_config" }
rox_cors = { path = "../../crates/rox_cors" }
rox_entrypoint = { path = "../../crates/rox_entrypoint" }
rox_env = { path = "../../crates/rox_env" }
rox_middleware = { path = "../../crates/rox_middleware", default-features = false, features = [
  "tracking",
] }
rox_tower_layers = { path = "../../crates/rox_tower_layers" }
model = { path = "../../crates/model" }
bytes = { workspace = true }
futures = { workspace = true }
lazy-regex = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
url = { workspace = true }
secretsmanager_client = { path = "../../crates/secretsmanager_client" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { workspace = true, features = ["axum"] }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
http-body-util = { workspace = true }
jsonwebtoken = { workspace = true }
rox_auth = { path = "../../crates/rox_auth", features = ["testing"] }
uuid = { workspace = true }
