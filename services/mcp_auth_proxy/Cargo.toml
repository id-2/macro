[package]
edition = "2024"
name = "mcp_auth_proxy"
publish = false
readme = "README.md"
version = "0.1.0"

[features]
default = ["inbound", "outbound"]
inbound = [
  "dep:ai_toolset",
  "dep:askama",
  "dep:axum",
  "dep:axum-extra",
  "dep:rox_auth",
  "dep:rox_authorization",
  "dep:rox_user_id",
  "dep:tower",
  "dep:tower-http",
]
outbound = [
  "dep:chrono",
  "dep:cursor_api_key",
  "dep:fusionauth",
  "dep:rox_tower_layers",
  "dep:model",
  "dep:reqwest",
  "dep:sqlx",
  "dep:upstream_error",
  "dep:zeroize",
]

[dependencies]
anyhow = { workspace = true }
askama = { workspace = true, optional = true }
ai_toolset = { path = "../../crates/ai_toolset", optional = true }
axum = { workspace = true, features = ["tower-log"], optional = true }
axum-extra = { workspace = true, features = ["cookie"], optional = true }
base64 = { workspace = true }
bot_id = { path = "../../crates/bot_id" }
chrono = { workspace = true, optional = true }
cursor_api_key = { path = "../../crates/cursor_api_key", optional = true }
fusionauth = { path = "../../crates/fusionauth", optional = true }
rox_authorization = { path = "../../crates/rox_authorization", default-features = false, optional = true }
rox_auth = { path = "../../crates/rox_auth", optional = true }
rox_tower_layers = { path = "../../crates/rox_tower_layers", optional = true }
rox_user_id = { path = "../../crates/rox_user_id", optional = true }
model = { path = "../../crates/model", optional = true }
rand = { workspace = true }
redis = { workspace = true, features = ["aio", "tokio-comp"] }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, optional = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tower = { workspace = true, features = ["util"], optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true }
upstream_error = { path = "../../crates/upstream_error", default-features = false, optional = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
jsonwebtoken = { workspace = true }
async-trait = { workspace = true }
rox_auth = { path = "../../crates/rox_auth", features = ["testing"] }
rox_db_migrator = { path = "../../crates/rox_db_migrator" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }
