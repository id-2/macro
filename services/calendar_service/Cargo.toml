[package]
default-run = "calendar_service"
edition = "2024"
name = "calendar_service"
publish = false
version = "0.1.0"

[[bin]]
name = "calendar_service"
path = "src/main.rs"

[[bin]]
name = "calendar_service_openapi"
path = "src/openapi.rs"

[features]
connection_gateway = []
default = ["connection_gateway"]

[dependencies]
agent_correlation = { path = "../../crates/agent_correlation", features = ["http", "postgres"] }
email_api_client = { path = "../../crates/email_api_client", features = ["outbound-outlook", "microsoft-gate"] }
anyhow = { workspace = true }
authentication_service_client = { path = "../../crates/authentication_service_client" }
aws-sdk-secretsmanager = { workspace = true }
aws-sdk-sqs = { workspace = true }
axum = { workspace = true }
calendar_events = { path = "../../crates/calendar_events", features = [
  "google",
  "inbound",
  "postgres",
] }
calendar_scheduling = { path = "../../crates/calendar_scheduling", features = ["calendar", "inbound", "postgres"] }
chrono = { workspace = true }
connection_gateway_client = { path = "../../crates/connection_gateway_client" }
email_db_client = { path = "../../crates/email_db_client" }
email_utils = { path = "../../crates/email_utils" }
futures = { workspace = true }
google_token = { path = "../../crates/google_token" }
rox_auth = { path = "../../crates/rox_auth" }
rox_authorization = { path = "../../crates/rox_authorization", features = [
  "postgres",
] }
rox_aws_config = { path = "../../crates/rox_aws_config" }
rox_config = { path = "../../crates/rox_config" }
rox_cors = { path = "../../crates/rox_cors" }
rox_tower_layers = { path = "../../crates/rox_tower_layers" }
rox_entrypoint = { path = "../../crates/rox_entrypoint" }
rox_env = { path = "../../crates/rox_env" }
rox_env_var = { path = "../../crates/rox_env_var" }
rox_event_broker = { path = "../../crates/rox_event_broker" }
rox_queues = { path = "../../crates/rox_queues" }
rox_service_urls = { path = "../../crates/rox_service_urls" }
models_email = { path = "../../crates/models_email" }
redis = { workspace = true, features = ["tokio-rustls-comp"] }
reqwest = { workspace = true }
rootcause = { workspace = true }
secretsmanager_client = { path = "../../crates/secretsmanager_client" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
sqs_worker = { path = "../../crates/sqs_worker" }
subtle = { workspace = true }
teams = { path = "../../crates/teams", default-features = false, features = ["outbound", "ports"] }
tokio = { workspace = true, features = ["signal"] }
tokio-util = { workspace = true, features = ["rt"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["compression-gzip"] }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
rox_db_migrator = { path = "../../crates/rox_db_migrator" }
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
