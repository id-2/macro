[package]
edition = "2024"
name = "call_recording_preview_handler"
publish = false
version = "0.1.0"

[dependencies]
anyhow = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws_lambda_events = { workspace = true, features = ["s3"] }
lambda_runtime = { workspace = true }
rox_aws_config = { path = "../../crates/rox_aws_config", features = ["s3"] }
rox_entrypoint = { path = "../../crates/rox_entrypoint" }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["fs", "process", "time"] }
tracing = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
rox_env_var = { path = "../../crates/rox_env_var" }

[dev-dependencies]
rox_db_migrator = { path = "../../crates/rox_db_migrator" }
