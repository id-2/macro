[package]
edition = "2024"
name = "document_upload_finalizer_handler"
publish = false
version = "0.1.0"

[dependencies]
anyhow = { workspace = true }
aws_lambda_events = { workspace = true, features = ["eventbridge"] }
aws-sdk-s3 = { workspace = true }
aws-sdk-sqs = { workspace = true }
bots = { path = "../../crates/bots", default-features = false, features = ["outbound"] }
documents = { path = "../../crates/documents", default-features = false, features = [
  "markdown_init",
  "outbound",
  "ports",
] }
entity_registry = { path = "../../crates/entity_registry/entity_registry" }
entity_registry_db_utils = { path = "../../crates/entity_registry/entity_registry_db_utils" }
lambda_runtime = { workspace = true }
lexical_client = { path = "../../crates/lexical_client" }
rox_aws_config = { path = "../../crates/rox_aws_config", features = ["s3"] }
rox_entrypoint = { path = "../../crates/rox_entrypoint" }
rox_env_var = { path = "../../crates/rox_env_var" }
rox_queues = { path = "../../crates/rox_queues" }
rox_uuid = { path = "../../crates/rox_uuid" }
model = { path = "../../crates/model" }
model_owner = { path = "../../crates/model_owner" }
s3_key = { path = "../../crates/s3_key" }
rox_service_urls = { path = "../../crates/rox_service_urls" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls"] }
sqs_client = { path = "../../crates/sqs_client" }
sync_service_client = { path = "../../crates/sync_service_client" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
urlencoding = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[[bin]]
name = "document_upload_finalizer_local_worker"
path = "src/bin/local_worker.rs"
