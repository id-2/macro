[package]
default-run = "notification_service"
edition = "2024"
name = "notification_service"
publish = false
version = "0.1.0"

[[bin]]
name = "notification_service"
path = "src/main.rs"

[[bin]]
name = "notification_service_openapi"
path = "src/openapi.rs"

[[bin]]
name = "notification_service_doppler_config"
path = "src/doppler_config.rs"

[features]
default = ["push_notification_event_handler"]
local_queue = []
push_notification_event_handler = []

[dependencies]
agent_correlation = { path = "../../crates/agent_correlation", features = ["http", "postgres"] }
anyhow = { workspace = true }
aws-sdk-secretsmanager = { workspace = true }
aws-sdk-sesv2 = { workspace = true }
aws-sdk-sns = { workspace = true }
aws-sdk-sqs = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
database_env_vars = { path = "../../crates/database_env_vars" }
email_formatting = { path = "../../crates/email_formatting" }
hmac = { workspace = true }
http-body-util = { workspace = true }
itertools = { workspace = true }
last_online_tracker = { path = "../../crates/last_online_tracker" }
rox_auth = { path = "../../crates/rox_auth" }
rox_authorization = { path = "../../crates/rox_authorization", features = [
  "postgres",
] }
rox_aws_config = { path = "../../crates/rox_aws_config" }
rox_config = { path = "../../crates/rox_config" }
doppler-config = { workspace = true }
rox_cors = { path = "../../crates/rox_cors" }
rox_entrypoint = { path = "../../crates/rox_entrypoint" }
rox_env = { path = "../../crates/rox_env" }
rox_env_var = { path = "../../crates/rox_env_var" }
rox_event_broker = { path = "../../crates/rox_event_broker" }
rox_middleware = { path = "../../crates/rox_middleware", default-features = false }
rox_queues = { path = "../../crates/rox_queues" }
rox_tower_layers = { path = "../../crates/rox_tower_layers" }
rox_user_id = { path = "../../crates/rox_user_id" }
model = { path = "../../crates/model" }
model-entity = { path = "../../crates/model-entity" }
model-error-response = { path = "../../crates/model-error-response" }
model_notifications = { path = "../../crates/model_notifications" }
models_pagination = { path = "../../crates/models_pagination", features = [
  "axum",
] }
notification = { path = "../../crates/notification", features = ["axum"] }
notification_db_client = { path = "../../crates/notification_db_client" }
rate_limit = { path = "../../crates/rate_limit" }
redis = { workspace = true }
secretsmanager_client = { path = "../../crates/secretsmanager_client" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sns_client = { path = "../../crates/sns_client" }
sqlx = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["compression-gzip"] }
tracing = { workspace = true }
utoipa = { workspace = true, features = ["chrono"] }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true }

rox_service_urls = { path = "../../crates/rox_service_urls" }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
rox_auth = { path = "../../crates/rox_auth", features = ["testing"] }
