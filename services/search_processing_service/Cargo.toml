[package]
default-run = "search_processing_service"
edition = "2024"
name = "search_processing_service"
publish = false
version = "0.1.0"

[features]
default = ["processing", "service", "pdf"]
processing = [
  "dep:call",
  "dep:channels",
  "dep:chat",
  "dep:documents",
  "dep:email",
  "dep:kafka_util",
  "dep:rox_event_broker",
  "dep:rox_event_topics",
  "dep:models_properties",
  "dep:projects",
  "dep:properties",
  "dep:rdkafka",
  "dep:rootcause",
  "dep:tokio-retry",
]
service = [
  "dep:documents",
  "dep:rox_event_broker",
  "rox_db_client",
  "dep:models_properties",
  "dep:properties",
]
pdf = ["dep:pdfium-render"]
# Local stacks skip pdfium: its bundled library is amd64-only and isn't in their
# runtime image. Additive, unlike dropping the default `pdf` feature, so this
# service builds in the same cargo invocation as every other local service.
no_pdf = []

[[bin]]
name = "search_processing_service"
path = "src/main.rs"
required-features = ["processing", "service"]

[[bin]]
name = "search_processing_service_doppler_config"
path = "src/doppler_config.rs"

[dependencies]
agent_session = { path = "../../crates/agent_session", default-features = false, features = ["outbound"] }
bots = { path = "../../crates/bots", default-features = false, features = ["outbound", "ports"] }
entity_registry = { path = "../../crates/entity_registry/entity_registry", default-features = false }
entity_registry_db_utils = { path = "../../crates/entity_registry/entity_registry_db_utils" }
agent_fold = { path = "../../crates/folds/agent_fold" }
anyhow = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-sdk-sqs = { workspace = true }
axum = { workspace = true }
call = { path = "../../crates/call", default-features = false, optional = true }
channels = { path = "../../crates/channels", default-features = false, optional = true }
messages = { path = "../../crates/messages", features = ["broker"] }
chat = { path = "../../crates/chat", default-features = false, optional = true }
chrono = { workspace = true }
comms_db_client = { path = "../../crates/comms_db_client" }
email = { path = "../../crates/email", default-features = false, optional = true }
email_db_client = { path = "../../crates/email_db_client" }
encoding_rs = { workspace = true }
futures = { workspace = true }
http-body-util = { workspace = true }
kafka_util = { path = "../../crates/kafka_util", optional = true }
lexical_client = { path = "../../crates/lexical_client" }
rox_auth = { path = "../../crates/rox_auth" }
rox_authorization = { path = "../../crates/rox_authorization", features = [
  "postgres",
] }
rox_aws_config = { path = "../../crates/rox_aws_config", features = ["s3"] }
rox_cors = { path = "../../crates/rox_cors" }
rox_config = { path = "../../crates/rox_config" }
rox_db_client = { path = "../../crates/rox_db_client", optional = true } # Make this optional
rox_entrypoint = { path = "../../crates/rox_entrypoint" }
rox_env = { path = "../../crates/rox_env" }
rox_env_var = { path = "../../crates/rox_env_var" }
calendar_events = { path = "../../crates/calendar_events" }
rox_event_broker = { path = "../../crates/rox_event_broker", default-features = false, features = [
  "outbound",
], optional = true }
rox_event_topics = { path = "../../crates/rox_event_topics", optional = true }
rox_queues = { path = "../../crates/rox_queues" }
rox_middleware = { path = "../../crates/rox_middleware", default-features = false }
rox_user_id = { path = "../../crates/rox_user_id" }
rox_uuid = { path = "../../crates/rox_uuid" }
mention_utils = { path = "../../crates/mention_utils" }
document_sub_type = { path = "../../crates/document_sub_type" }
documents = { path = "../../crates/documents", default-features = false, optional = true }
ai_engine = { path = "../../crates/ai_engine" }
fig_engine = { path = "../../crates/fig_engine" }
psd_engine = { path = "../../crates/psd_engine" }
doppler-config = { workspace = true }
model = { path = "../../crates/model" }
model_owner = { path = "../../crates/model_owner" }
s3_key = { path = "../../crates/s3_key" }
models_email = { path = "../../crates/models_email" }
model_file_type = { path = "../../crates/model_file_type" }
models_properties = { path = "../../crates/models_properties", optional = true }
models_search = { path = "../../crates/models_search" }
nom = { workspace = true }
opensearch_client = { path = "../../crates/opensearch_client" }
ensure_exists = { path = "../../crates/ensure_exists", features = ["dynamodb"] }
pdfium-render = { workspace = true, optional = true }
properties = { path = "../../crates/properties", default-features = false, features = [
  "outbound",
], optional = true }
projects = { path = "../../crates/projects", default-features = false, optional = true }
rdkafka = { workspace = true, optional = true }
rootcause = { workspace = true, optional = true }
rust-embed = "8.6.0"
s3_client = { path = "../../crates/s3_client" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
sqs_client = { path = "../../crates/sqs_client", default-features = false, features = [
  "search",
] }
sqs_worker = { path = "../../crates/sqs_worker" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["signal", "sync", "time"] }
tokio-retry = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["rt"] }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true }

rox_service_urls = { path = "../../crates/rox_service_urls" }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
