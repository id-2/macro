[package]
name = "passwords"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
openbao_client = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
rootcause = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
jsonwebtoken = { workspace = true }
lazy-regex = { workspace = true }
rox_user_id = { path = "../rox_user_id" }
feature_flags = { path = "../feature_flags" }
rox_authorization = { path = "../rox_authorization", default-features = false, features = ["axum"] }
rox_db_client = { path = "../rox_db_client" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true, features = ["trace"] }
utoipa = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v7"] }
zeroize = { workspace = true, features = ["derive"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rox_db_migrator = { path = "../rox_db_migrator" }
model_user = { path = "../model_user" }
tower = { workspace = true }
tracing-subscriber = { workspace = true }
