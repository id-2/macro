[package]
edition = "2024"
name = "rox_authorization"
publish = false
version = "0.1.0"

[features]
axum = [
  "dep:axum",
  "dep:rox_auth",
  "dep:model-error-response",
  "dep:serde",
]
default = ["axum", "outbound"]
local_auth = ["dep:rox_env_var"]
outbound = ["dep:rox_auth"]
postgres = ["dep:sqlx", "dep:sha2"]

[dependencies]
axum = { workspace = true, optional = true }
bot_id = { path = "../bot_id" }
bot_token = { path = "../bot_token" }
constant_time_eq = { workspace = true }
harness_id = { path = "../harness_id" }
harness_token = { path = "../harness_token" }
rox_auth = { path = "../rox_auth", optional = true }
rox_env_var = { path = "../rox_env_var", optional = true }
rox_user_id = { path = "../rox_user_id" }
model-error-response = { path = "../model-error-response", optional = true }
model_user = { path = "../model_user" }
rootcause = { workspace = true }
serde = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
harness_id = { path = "../harness_id", features = ["test-utils"] }
http-body-util = { workspace = true }
jsonwebtoken = { workspace = true }
rox_auth = { path = "../rox_auth", features = ["testing"] }
rox_db_migrator = { path = "../rox_db_migrator" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }
tracing-subscriber = { workspace = true }
