[package]
edition = "2024"
name = "gtm_invite"
publish = false
version = "0.1.0"

[features]
axum = [
  "dep:axum",
  "dep:ip_extractor",
  "dep:rox_authorization",
  "dep:model-error-response",
  "dep:tower",
  "dep:utoipa",
]
default = ["axum", "inbound", "outbound", "ports"]
inbound = ["axum", "ports"]
outbound = ["dep:sqlx", "ports"]
ports = []

[dependencies]
# Core
anyhow = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# Domain models
rox_authorization = { path = "../rox_authorization", optional = true, default-features = false, features = [
  "axum",
] }
rox_user_id = { path = "../rox_user_id" }
rox_uuid = { path = "../rox_uuid" }
rate_limit = { path = "../rate_limit", features = ["axum"] }

# Axum dependencies (for inbound)
axum = { workspace = true, optional = true }
ip_extractor = { path = "../ip_extractor", optional = true }
model-error-response = { path = "../model-error-response", optional = true }
tower = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

# Outbound dependencies
sqlx = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
http-body-util = { workspace = true }
rox_db_migrator = { path = "../rox_db_migrator" }
mockall = { workspace = true }
model_user = { path = "../model_user" }
rate_limit = { path = "../rate_limit", features = ["axum", "testing"] }
rootcause = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }
