[package]
edition = "2024"
exclude = ["examples/"]
name = "rox_auth"
publish = false
version = "0.1.0"

[features]
testing = []

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true, features = ["cookie", "typed-header"] }
cookie = { workspace = true, features = ["percent-encode"] }
jsonwebtoken = { workspace = true }
rox_env = { path = "../rox_env" }
rox_env_var = { path = "../rox_env_var" }
rox_user_id = { path = "../rox_user_id" }
remote_env_var = { path = "../remote_env_var" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
