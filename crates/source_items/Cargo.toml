[package]
edition = "2024"
name = "source_items"
publish = false
version = "0.1.0"

[features]
cli = ["dep:clap", "dep:rox_env_var", "dep:rox_entrypoint"]

[dependencies]
clap = { workspace = true, features = ["derive"], optional = true }
rox_env_var = { path = "../rox_env_var", optional = true }
model-entity = { path = "../model-entity" }
rootcause = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing = { workspace = true }
rox_entrypoint = { path = "../rox_entrypoint", optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
rox_db_migrator = { path = "../rox_db_migrator" }
rand = { workspace = true }

[[bin]]
name = "source_items"
path = "src/bin/source_items.rs"
required-features = ["cli"]
