[package]
edition = "2024"
name = "documents"
publish = false
version = "0.1.0"

[[bin]]
name = "backfill_markdown_content_location"
path = "src/bin/backfill_markdown_content_location.rs"
required-features = ["backfill_binary"]

[[bin]]
name = "enqueue_orphaned_email_attachments"
path = "src/bin/enqueue_orphaned_email_attachments.rs"
required-features = ["backfill_binary"]

[features]
purge = [
  "ports",
  "outbound",
  "dep:rox_db_client",
  "dep:rox_sha_count_client",
  "dep:sqs_client",
  "dep:comms_db_client",
]
ai_tools = [
  "dep:ai_billing",
  "dep:base64",
  "dep:ai_engine",
  "dep:ai_toolset",
  "dep:ai_usage",
  "dep:docx_engine",
  "dep:fig_engine",
  "dep:async-trait",
  "dep:loro",
  "dep:rox_tower_layers",
  "dep:messages",
  "dep:rox_db_client",
  "dep:model_file_type",
  "dep:pptx_engine",
  "dep:psd_engine",
  "dep:schemars",
  "dep:sha2",
  "document_create_adapters",
  "outbound",
  "ports",
]
attachment = [
  "dep:ai_toolset",
  "dep:attachment",
  "dep:lexical_client",
  "dep:model_file_type",
  "dep:reqwest",
  "ports",
]
axum = [
  "dep:axum",
  "dep:axum-extra",
  "dep:base64",
  "dep:entity_registry",
  "dep:jsonwebtoken",
  "dep:lexical_client",
  "dep:rox_authorization",
  "dep:model-error-response",
  "dep:model_user",
  "dep:task_dedup",
  "dep:utoipa",
  "entity_access/axum",
  "entity_registry/axum",
  "messages?/inbound",
  "schema",
]
backfill_binary = [
  "dep:clap",
  "dep:rox_entrypoint",
  "dep:rox_service_urls",
  "markdown_init",
  "outbound",
  "ports",
]
default = ["ai_tools", "axum", "inbound", "outbound", "ports", "service"]
document_create = ["dep:base64", "dep:sha2", "ports"]
document_create_adapters = [
  "dep:comms_db_client",
  "dep:reqwest",
  "dep:sqlx",
  "document_create",
  "markdown_init",
]
inbound = ["axum", "document_create_adapters", "ports"]
markdown_init = ["dep:lexical_client"]
outbound = [
  "activity/outbound",
  "dep:aws-sdk-s3",
  "dep:base64",
  "dep:entity_access_db_utils",
  "dep:entity_registry",
  "dep:entity_registry_db_utils",
  "dep:enterprise",
  "enterprise/outbound",
  "dep:hex",
  "dep:redis",
  "dep:share_permission_db_utils",
  "dep:sqlx",
  "ports",
]
ports = ["dep:shared_entity_registry", "dep:tokio", "dep:tokio-retry"]
schema = ["dep:utoipa", "rox_user_id/schema", "pptx_engine?/openapi"]
service = [
  "dep:entity_access_management",
  "dep:foreign_entity",
  "dep:github_pull_requests",
  "ports",
]

[dependencies]
agent_correlation = { path = "../agent_correlation" }
rox_db_client = { path = "../rox_db_client", optional = true }
rox_sha_count_client = { path = "../rox_sha_count_client", optional = true }
sqs_client = { path = "../sqs_client", optional = true }
activity = { path = "../activity", default-features = false }
bot_id = { path = "../bot_id" }
# Core
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }
uuid = { workspace = true }

# Domain models (always included)
connection = { path = "../connection", default-features = false, features = [
  "ports",
] }
document_sub_type = { path = "../document_sub_type" }
entity_access = { path = "../entity_access" }
entity_mutation = { path = "../entity_mutation" }
entity_access_management = { path = "../entity_access_management", default-features = false, features = [
  "outbound",
  "ports",
], optional = true }
foreign_entity = { path = "../foreign_entity", default-features = false, features = [
  "ports",
], optional = true }
github_pull_requests = { path = "../github_pull_requests", default-features = false, optional = true }
rox_authorization = { path = "../rox_authorization", optional = true, default-features = false, features = [
  "axum",
] }
rox_aws_config = { path = "../rox_aws_config", features = ["s3"] }
rox_entrypoint = { path = "../rox_entrypoint", optional = true }
rox_env_var = { path = "../rox_env_var" }
rox_event_broker = { path = "../rox_event_broker", default-features = false }
rox_event_topics = { path = "../rox_event_topics" }
rox_service_urls = { path = "../rox_service_urls", optional = true }
rox_sync_service_jwt = { path = "../rox_sync_service_jwt" }
rox_user_id = { path = "../rox_user_id" }
rox_uuid = { path = "../rox_uuid" }
system_skills = { path = "../system_skills" }
model = { path = "../model" }
model-entity = { path = "../model-entity" }
models_permissions = { path = "../models_permissions" }
models_properties = { path = "../models_properties" }
rootcause = { workspace = true }
s3_key = { path = "../s3_key" }

# Async runtime (for ports)
tokio = { workspace = true, optional = true }
tokio-retry = { workspace = true, optional = true }

# Axum dependencies (for inbound)
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
model-error-response = { path = "../model-error-response", optional = true }
model_user = { path = "../model_user", optional = true }
utoipa = { workspace = true, optional = true }

# Outbound dependencies
aws-sdk-s3 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
cloudfront_sign = { workspace = true }
comms_db_client = { path = "../comms_db_client", optional = true }
entity_access_db_utils = { path = "../entity_access_db_utils", optional = true }
entity_registry = { path = "../entity_registry/entity_registry", optional = true }
entity_registry_db_utils = { path = "../entity_registry/entity_registry_db_utils", optional = true }
enterprise = { path = "../enterprise", default-features = false, optional = true }
shared_entity_registry = { path = "../entity_registry/shared_entity_registry", optional = true }
model_owner = { path = "../model_owner" }
futures = { workspace = true }
share_permission_db_utils = { path = "../share_permission_db_utils", optional = true }
hex = { workspace = true, optional = true }
redis = { workspace = true, optional = true, features = ["aio", "tokio-rustls-comp"] }
sqlx = { workspace = true, optional = true }
sync_service_client = { path = "../sync_service_client" }
task_dedup = { path = "../task_dedup", optional = true }

# AI Tool dependencies
ai_billing = { path = "../ai_billing", optional = true }
ai_toolset = { path = "../ai_toolset", optional = true }
ai_usage = { path = "../ai_usage", optional = true }
async-trait = { workspace = true, optional = true }
lexical_client = { path = "../lexical_client", optional = true }
loro = { workspace = true, optional = true }
rox_tower_layers = { path = "../rox_tower_layers", optional = true }
messages = { path = "../messages", optional = true, features = ["ports"] }
model_file_type = { path = "../model_file_type", optional = true }
ai_engine = { path = "../ai_engine", optional = true }
docx_engine = { path = "../docx_engine", optional = true }
fig_engine = { path = "../fig_engine", optional = true }
pptx_engine = { path = "../pptx_engine", optional = true, features = ["embedded-fonts", "schema"] }
psd_engine = { path = "../psd_engine", optional = true }
reqwest = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }


# Attachment
attachment = { path = "../attachment", optional = true }
non_empty = { path = "../non_empty" }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
channel_sender = { path = "../channel_sender" }
messages = { path = "../messages", features = ["ports", "test-utils"] }
bot_id = { path = "../bot_id", features = ["test-utils"] }
embedding = { path = "../embedding" }
http-body-util = { workspace = true }
kafka_util = { path = "../kafka_util" }
rox_db_migrator = { path = "../rox_db_migrator" }
# Examples need the Kafka adapter (outbound); the library itself only uses ports.
rox_event_broker = { path = "../rox_event_broker" }
mockall = { workspace = true }
rdkafka = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "test-util"] }
tower = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
