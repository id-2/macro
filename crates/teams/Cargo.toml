[package]
edition = "2024"
name = "teams"
publish = false
version = "0.1.0"

[[bin]]
name = "backfill_teammate_dms"
path = "src/bin/backfill_teammate_dms.rs"
required-features = ["backfill_binary"]

[features]
ai_tools = [
  "dep:ai_toolset",
  "dep:async-trait",
  "dep:schemars",
  "entity_access/ports",
  "ports",
]
axum = [
  "dep:axum",
  "dep:rox_authorization",
  "dep:model-error-response",
  "dep:utoipa",
  "entity_access/axum",
  "entity_access/inbound",
  "entity_access/ports",
]
backfill_binary = [
  "channels/outbound",
  "dep:database_env_vars",
  "dep:rox_entrypoint",
  "outbound",
  "ports",
]
default = ["ai_tools", "axum", "inbound", "outbound", "ports"]
inbound = ["axum", "ports"]
outbound = [
  "model_user/sqlx",
  "dep:analytics_client",
  "dep:contacts",
  "dep:entity_access_db_utils",
  "dep:enterprise",
  "enterprise/outbound",
  "dep:models_email",
  "dep:sqlx",
  "dep:sqs_client",
  "dep:url",
  "ports",
]
ports = [
  "dep:model-entity",
  "dep:model_notifications",
  "dep:notification",
  "dep:tokio",
]

[dependencies]
# Core
ai_toolset = { path = "../ai_toolset", optional = true }
anyhow = { workspace = true }
async-stripe = { workspace = true, default-features = false, features = [
  "billing",
  "checkout",
  "runtime-tokio-hyper",
] }
async-trait = { workspace = true, optional = true }
bot_id = { path = "../bot_id" }
chrono = { workspace = true }
channels = { path = "../channels", default-features = false, features = ["ports"] }
contacts = { path = "../contacts", default-features = false, optional = true }
database_env_vars = { path = "../database_env_vars", optional = true }
rox_authorization = { path = "../rox_authorization", optional = true, default-features = false, features = [
  "axum",
] }
rox_entrypoint = { path = "../rox_entrypoint", optional = true }
rox_event_broker = { path = "../rox_event_broker", default-features = false }
rox_event_topics = { path = "../rox_event_topics" }
rox_user_id = { path = "../rox_user_id" }
rox_uuid = { path = "../rox_uuid" }
model_owner = { path = "../model_owner" }
models_permissions = { path = "../models_permissions" }
non_empty = { path = "../non_empty" }
roles_and_permissions = { path = "../roles_and_permissions", default-features = false, features = [
  "ports",
] }
rootcause = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
shared_entity_registry = { path = "../entity_registry/shared_entity_registry" }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

entity_access = { path = "../entity_access", default-features = false }
generic_email_domains = { path = "../generic_email_domains" }

# Async runtime (for ports)
tokio = { workspace = true, optional = true }

# Axum dependencies (for inbound)
axum = { workspace = true, optional = true }
model-error-response = { path = "../model-error-response", optional = true }
model_user = { path = "../model_user" }
utoipa = { workspace = true, optional = true }

# Notification dependencies (for ports)
model-entity = { path = "../model-entity", optional = true }
model_notifications = { path = "../model_notifications", optional = true }
notification = { path = "../notification", optional = true, default-features = false }

# Outbound dependencies
analytics_client = { path = "../analytics_client", optional = true }
entity_access_db_utils = { path = "../entity_access_db_utils", optional = true }
enterprise = { path = "../enterprise", default-features = false, optional = true }
models_email = { path = "../models_email", optional = true }
sqlx = { workspace = true, optional = true }
sqs_client = { path = "../sqs_client", default-features = false, features = [
  "email",
], optional = true }
url = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
wiremock = { workspace = true }
rox_db_migrator = { path = "../rox_db_migrator" }
models_pagination = { path = "../models_pagination" }
tokio = { workspace = true }
tower = { workspace = true }
