[package]
edition = "2024"
name = "bots"
publish = false
version = "0.1.0"

[features]
ai_tools = [
  "dep:ai_toolset",
  "dep:async-trait",
  "dep:entity_access",
  "dep:schemars",
  "entity_access/ports",
  "ports",
]
default = ["inbound", "outbound", "ports"]
inbound = [
  "dep:axum",
  "dep:axum-extra",
  "dep:channels",
  "dep:entity_access",
  "entity_access/inbound",
  "entity_access/ports",
  "dep:rox_authorization",
  "dep:model-error-response",
  "rox_authorization/axum",
  "dep:serde_json",
  "dep:utoipa",
  "messages/schema",
  "ports",
]
outbound = ["dep:sqlx", "dep:rox_uuid", "dep:entity_registry", "dep:model_owner", "dep:rootcause", "ports"]
# Pushes changed bot profiles from the bot topic to web clients.
realtime = [
  "dep:connection_gateway_client",
  "dep:kafka_util",
  "dep:model-entity",
  "dep:rdkafka",
  "dep:serde_json",
  "inbound",
  "rox_event_broker/outbound",
  "outbound",
]
ports = ["dep:entity_access", "entity_access/ports", "dep:rootcause", "dep:tokio", "messages/ports"]
test-utils = ["dep:mockall", "ports"]

[dependencies]
ai_toolset = { path = "../ai_toolset", optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true, features = ["query"] }
bot_id = { path = "../bot_id", features = ["schema"] }
bot_token = { path = "../bot_token" }
harness_id = { path = "../harness_id", features = ["schema", "sqlx"] }
harnesses = { path = "../harnesses", default-features = false, features = ["ports"] }
channels = { path = "../channels", optional = true, default-features = false, features = ["ports"] }
chrono = { workspace = true }
connection_gateway_client = { path = "../connection_gateway_client", optional = true }
entity_access = { path = "../entity_access", optional = true, default-features = false }
entity_registry = { path = "../entity_registry/entity_registry", optional = true }
model_owner = { path = "../model_owner", optional = true }
rootcause = { workspace = true, optional = true }
hex = { workspace = true }
kafka_util = { path = "../kafka_util", optional = true }
rox_authorization = { path = "../rox_authorization", optional = true, default-features = false }
messages = { path = "../messages" }
rox_event_broker = { path = "../rox_event_broker", default-features = false }
mockall = { workspace = true, optional = true }
model-entity = { path = "../model-entity", optional = true }
rox_event_topics = { path = "../rox_event_topics" }
rox_user_id = { path = "../rox_user_id" }
rox_uuid = { path = "../rox_uuid", optional = true }
model-error-response = { path = "../model-error-response", optional = true }
rand = { workspace = true }
rdkafka = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
async-trait = { workspace = true }
entity_access = { path = "../entity_access", default-features = false, features = [
  "outbound",
  "ports",
] }
rox_db_migrator = { path = "../rox_db_migrator" }
rootcause = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }
