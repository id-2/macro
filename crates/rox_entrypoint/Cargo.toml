[package]
edition = "2024"
name = "rox_entrypoint"
publish = false
version = "0.1.0"

[dependencies]
dotenvy = { workspace = true }
rox_env = { path = "../rox_env" }
opentelemetry = { workspace = true, features = ["logs", "metrics", "trace"] }
opentelemetry_sdk = { workspace = true, features = ["logs", "metrics", "rt-tokio", "trace"] }
opentelemetry-appender-tracing = { workspace = true }
opentelemetry-otlp = { workspace = true }
rootcause = { workspace = true }
rootcause-tracing = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-panic = "0.1"
tracing-subscriber = { workspace = true }
tracing-tree = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
rox_env_var = { path = "../rox_env_var" }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["time"] }
