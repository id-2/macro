[package]
edition = "2024"
name = "entity_registry"
publish = false
version = "0.1.0"

[features]
axum = ["dep:axum", "rox_authorization/axum"]
default = []
postgres = ["dep:sqlx", "model_owner/sqlx"]

[dependencies]
axum = { workspace = true, optional = true }
bot_id = { path = "../../bot_id" }
chrono = { workspace = true }
rox_authorization = { path = "../../rox_authorization", default-features = false }
model-entity = { path = "../../model-entity" }
model_owner = { path = "../../model_owner" }
rootcause = { workspace = true }
shared_entity_registry = { path = "../shared_entity_registry" }
thiserror = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
harness_id = { path = "../../harness_id" }
rox_db_migrator = { path = "../../rox_db_migrator" }
rox_user_id = { path = "../../rox_user_id" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true, features = ["v7"] }
