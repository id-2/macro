[#setting url_escaping_charset="UTF-8"]
<!doctype html>
<html lang="ru" xmlns:o="urn:schemas-microsoft-com:office:office">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta
      name="format-detection"
      content="telephone=no, date=no, address=no, email=no"
    />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>Код для входа в Rox</title>
    <!--[if mso]>
      <noscript
        ><xml
          ><o:OfficeDocumentSettings
            ><o:PixelsPerInch>96</o:PixelsPerInch
            ><o:AllowPNG /></o:OfficeDocumentSettings></xml
      ></noscript>
    <![endif]-->
    <style>
      @media screen and (max-width: 600px) {
        .email-page {
          padding: 24px 12px !important;
        }
        .email-content {
          padding: 28px 24px !important;
        }
        .email-heading {
          font-size: 26px !important;
          line-height: 34px !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #f5f5f4;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    "
  >
    <div
      style="
        display: none;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        mso-hide: all;
      "
    >
      Одноразовый код для входа в Rox.
    </div>
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      bgcolor="#f5f5f4"
      style="
        font-family: Arial, Helvetica, sans-serif;
        color: #222222;
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      "
    >
      <tr>
        <td class="email-page" align="center" style="padding: 48px 20px">
          <!--[if mso]><table role="presentation" width="560" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 560px; table-layout: fixed"
          >
            <tr>
              <td
                class="email-content"
                bgcolor="#ffffff"
                style="
                  padding: 36px 40px 40px;
                  border: 1px solid #e7e7e5;
                  border-radius: 12px;
                  overflow-wrap: break-word;
                  word-wrap: break-word;
                "
              >
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  style="margin-bottom: 36px"
                >
                  <tr>
                    <td style="vertical-align: middle">
                      <a
                        href="https://rox.one"
                        style="
                          text-decoration: none;
                          font-size: 20px;
                          line-height: 24px;
                          font-weight: 600;
                          letter-spacing: -0.5px;
                          color: #222222;
                        "
                        >Rox</a
                      >
                    </td>
                  </tr>
                </table>
                <h1
                  class="email-heading"
                  style="
                    margin: 0 0 16px;
                    font-size: 28px;
                    line-height: 36px;
                    font-weight: 600;
                    letter-spacing: -0.5px;
                    color: #222222;
                  "
                >
                  Вход в Rox
                </h1>
                <p
                  style="
                    margin: 0 0 20px;
                    font-size: 16px;
                    line-height: 26px;
                    color: #525252;
                  "
                >
                  Введите этот код, чтобы войти.
                </p>
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  style="margin: 28px 0; table-layout: fixed"
                >
                  <tr>
                    <td
                      bgcolor="#f5f5f4"
                      style="
                        padding: 24px 12px;
                        border: 1px solid #e7e7e5;
                        border-radius: 8px;
                        text-align: center;
                        font-family: Arial, Helvetica, sans-serif;
                        font-size: 32px;
                        line-height: 44px;
                        font-weight: 600;
                        letter-spacing: 5px;
                        color: #222222;
                      "
                    >
                      ${code}
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 28px 0 0;
                    font-size: 14px;
                    line-height: 22px;
                    color: #737373;
                  "
                >
                  Если вы не запрашивали код, просто проигнорируйте это письмо.
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 24px 16px 0;
                  text-align: center;
                  font-size: 12px;
                  line-height: 20px;
                  color: #737373;
                "
              >
                Нужна помощь?
                <a
                  href="mailto:support@rox.one"
                  style="color: #525252; text-decoration: underline"
                  >Напишите в поддержку</a
                >
              </td>
            </tr>
          </table>
          <!--[if mso]></td></tr></table><![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
